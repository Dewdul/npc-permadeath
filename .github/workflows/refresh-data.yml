name: Refresh bundled data

# Regenerates the spawn seed and the boss list from their sources and commits
# them when they changed. Installed plugins pick the new files up within a
# week (see DataUpdater); the next Plugin Hub release bundles them.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate data files
        run: |
          python tools/generate_spawns.py
          python tools/generate_bosses.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/main/resources/com/npcpermadeath/spawns.csv.gz src/main/resources/com/npcpermadeath/bosses.txt
          if git diff --cached --quiet; then
            echo "Data unchanged"
          else
            git commit -m "Refresh bundled spawn and boss data"
            git push
          fi
